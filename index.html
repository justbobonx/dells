<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>DELLS</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="board"></canvas>

    <div id="hud">
      <div class="hud-left">
        <span id="level">6</span>
        <button id="btn-minus" type="button">-</button>
        <button id="btn-new" type="button">NEW</button>
        <button id="btn-plus" type="button">+</button>
      </div>
      <div class="hud-right">
        <button id="btn-check" type="button">CHECK</button>
      </div>
    </div>

    <div id="hud-bottom">
      <div class="hud-left"><span id="os-count">0/6 Vs</span></div>
      <div class="hud-right">
        <span>CLEARED <strong id="score-cleared">0</strong></span>
        <span>RIGHT <strong id="score-rights" class="good">0</strong></span>
        <span>WRONG <strong id="score-wrongs" class="bad">0</strong></span>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="start-panel">
        <h1>DELLS</h1>
        <button id="btn-start" type="button">Start</button>
        <a id="startEmail" href="https://x.com/just_bob" target="_blank" rel="noopener noreferrer">just_bob@X.com</a>
      </div>
    </div>

    <div id="win-screen" class="overlay" hidden>
      <div class="panel">
        <h1>WIN</h1>
        <button id="btn-win-new" type="button">NEW</button>
      </div>
    </div>

    <script src="js/sprite.js"></script>
    <script src="js/cell.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/solver.js"></script>
    <script src="js/save.js"></script>
    <script src="js/chrome.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
