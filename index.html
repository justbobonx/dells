<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>foxes</title>
    <link rel="stylesheet" href="css/style.css?v=19" />
  </head>
  <body>
    <canvas id="board"></canvas>

    <div id="hud">
      <div class="hud-left"><span id="os-count">0/6</span></div>
      <div class="hud-right">
        <span>CLEARED <strong id="score-cleared">0</strong></span>
        <span>RIGHT <strong id="score-rights" class="good">0</strong></span>
        <span>WRONG <strong id="score-wrongs" class="bad">0</strong></span>
      </div>
    </div>

    <div id="hud-bottom">
      <div class="hud-left">
        <button id="btn-menu" type="button">MENU</button>
      </div>
      <div class="hud-right">
        <button id="btn-check" type="button">CHECK</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="start-panel">
        <div class="title-row">
          <img class="title-fox" src="images/fox.png" width="64" height="64" alt="" />
          <h1>foxes</h1>
          <img class="title-fox" src="images/fox.png" width="64" height="64" alt="" />
        </div>
        <button id="btn-start" type="button">Start</button>
        <a id="startEmail" href="https://x.com/just_bob" target="_blank" rel="noopener noreferrer">just_bob@X.com</a>
      </div>
    </div>

    <div id="menu-screen" class="overlay" hidden>
      <div class="panel menu-panel">
        <button id="btn-reset" type="button">RESET</button>
        <div class="menu-row">
          <button id="btn-new" type="button">NEW</button>
          <button id="btn-new-minus" type="button">-</button>
          <button id="btn-new-plus" type="button">+</button>
        </div>
        <button id="btn-hint" type="button">HINT</button>
      </div>
    </div>

    <div id="win-screen" class="overlay" hidden>
      <div class="panel win-panel">
        <h1>WIN</h1>
        <button id="btn-win-new" type="button">NEXT</button>
      </div>
    </div>

    <script src="js/sprite.js?v=19"></script>
    <script src="js/cell.js?v=19"></script>
    <script src="js/grid.js?v=19"></script>
    <script src="js/solver.js?v=19"></script>
    <script src="js/save.js?v=19"></script>
    <script src="js/chrome.js?v=19"></script>
    <script src="js/game.js?v=19"></script>
  </body>
</html>
